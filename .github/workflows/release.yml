name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - name: Checkout (v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js (v6)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy
      - name: Validate versions
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT -eq 'push') {
            node scripts/release-utils.mjs validate "$env:RELEASE_TAG"
          } else {
            node scripts/release-utils.mjs validate
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test release utilities
        run: node --test scripts/release-utils.test.mjs
      - name: Install frontend dependencies
        run: npm ci --registry https://registry.npmjs.org
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend fixtures
        run: npm test
      - name: Test Rust fixtures
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check Rust warnings
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build Windows x64 NSIS installer
        run: npm run tauri build -- --bundles nsis -- --locked
      - name: Prepare validated assets
        id: assets
        run: |
          $installer = node scripts/release-utils.mjs prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-utils.mjs verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "installer=$installer" >> $env:GITHUB_OUTPUT
      - name: Upload installer and checksum (v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-x64-nsis
          path: |
            release-assets/${{ steps.assets.outputs.installer }}
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout release validation scripts (v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js (v6)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Download this run's validated assets (v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-x64-nsis
          path: release-assets
          digest-mismatch: error
      - name: Verify assets and publish new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = node scripts/release-utils.mjs verify "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existingTags = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existingTags -contains $env:RELEASE_TAG) {
            throw 'A release already exists for this tag; refusing to overwrite it.'
          }
          $notes = 'Windows x64 NSIS installer (unsigned). Windows SmartScreen may warn; verify the source and SHA256SUMS.txt before installing. Requires Windows 11, WebView2 Runtime, PowerShell 7, Windows Terminal, and OpenCode CLI on PATH. The installer uses the default WebView2 download bootstrapper when needed; PowerShell, Windows Terminal, and OpenCode are not bundled. CI uses synthetic fixtures and does not verify interactive OpenCode TUI behavior.'
          gh release create "$env:RELEASE_TAG" "release-assets/$installer" "release-assets/SHA256SUMS.txt" --verify-tag --title "OpenCode Session Manager $env:RELEASE_TAG" --notes "$notes" --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
